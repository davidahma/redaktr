<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Redaktr app icon — "Redacted line"</title>
  <desc>A deep-graphite macOS squircle with faint text lines and one opaque black redaction bar snapped over a single line, plus a small green cleared check. Master artwork; the shipped PNGs are generated by Scripts/generate_app_icon.swift.</desc>

  <!-- Icon shape: 824x824 centered in the 1024 canvas (transparent margin). -->
  <rect x="100" y="100" width="824" height="824" rx="184.4" fill="#222831"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="183.9" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="3.3"/>

  <!-- Artwork authored in a 150-unit tile, scaled 5.4933x and offset by the 100px margin. -->
  <g transform="translate(100,100) scale(5.49333)">
    <rect x="24" y="40" width="64" height="8" rx="4" fill="#C9CDD4" fill-opacity="0.5"/>
    <rect x="24" y="88" width="92" height="8" rx="4" fill="#C9CDD4" fill-opacity="0.5"/>
    <rect x="24" y="106" width="54" height="8" rx="4" fill="#C9CDD4" fill-opacity="0.5"/>

    <rect x="18" y="60" width="114" height="16" rx="4" fill="#0A0A0B"/>
    <rect x="18.5" y="60.5" width="113" height="15" rx="3.5" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>

    <circle cx="120" cy="30" r="11" fill="#34C759"/>
    <path d="M115 30 l3.2 3.2 L124 27" fill="none" stroke="#0D2A16" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
